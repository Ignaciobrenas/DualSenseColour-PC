<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822"/>
      <stop offset="100%" stop-color="#07080C"/>
    </linearGradient>

    <linearGradient id="iconRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>

    <radialGradient id="ambientCyan" cx="32%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientViolet" cx="68%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2432"/>
      <stop offset="100%" stop-color="#0D1017"/>
    </linearGradient>

    <linearGradient id="hueSpectrum" gradientUnits="userSpaceOnUse" x1="115" y1="150" x2="395" y2="350">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <filter id="ledBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blurWide"/>
      <feGaussianBlur stdDeviation="3.5" result="blurTight"/>
      <feMerge>
        <feMergeNode in="blurWide"/>
        <feMergeNode in="blurTight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="prismShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Contenedor Squircle -->
  <rect width="512" height="512" rx="114" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="114" fill="url(#ambientCyan)"/>
  <rect width="512" height="512" rx="114" fill="url(#ambientViolet)"/>
  <rect x="1" y="1" width="510" height="510" rx="113" fill="none" stroke="url(#iconRim)" stroke-width="2"/>

  <!-- Núcleo geométrico Touchpad Prism -->
  <g filter="url(#prismShadow)">
    <path d="M 140 156 L 372 156 L 340 310 C 337 323 326 332 312 332 L 200 332 C 186 332 175 323 172 310 Z"
          fill="url(#prismGrad)" stroke="#333C52" stroke-width="1.5"/>
    <!-- Reflejo superior del cristal -->
    <line x1="146" y1="158" x2="366" y2="158" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5"/>
  </g>

  <!-- Barras LED en V + Indicador inferior -->
  <g filter="url(#ledBloom)" fill="none" stroke-linecap="round">
    <!-- Flanco izquierdo -->
    <path d="M 122 152 L 158 316 Q 164 344 196 348" stroke="url(#hueSpectrum)" stroke-width="18"/>
    <path d="M 122 152 L 158 316 Q 164 344 196 348" stroke="#FFFFFF" stroke-width="3.5" stroke-opacity="0.9"/>

    <!-- Flanco derecho -->
    <path d="M 390 152 L 354 316 Q 348 344 316 348" stroke="url(#hueSpectrum)" stroke-width="18"/>
    <path d="M 390 152 L 354 316 Q 348 344 316 348" stroke="#FFFFFF" stroke-width="3.5" stroke-opacity="0.9"/>

    <!-- Barra indicadora central -->
    <line x1="224" y1="366" x2="288" y2="366" stroke="url(#hueSpectrum)" stroke-width="11"/>
    <line x1="224" y1="366" x2="288" y2="366" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.85"/>
  </g>
</svg>
