<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <radialGradient id="bannerBg" cx="24%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#171E30"/>
      <stop offset="52%" stop-color="#0B0E16"/>
      <stop offset="100%" stop-color="#06080D"/>
    </radialGradient>

    <radialGradient id="ambientLeft" cx="20%" cy="50%" r="36%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientRight" cx="84%" cy="22%" r="42%">
      <stop offset="0%" stop-color="#FF2A85" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF2A85" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientCenter" cx="55%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#7B61FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bannerRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64F3FF" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FF2A85" stop-opacity="0.40"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="68%" stop-color="#E7EEFA"/>
      <stop offset="100%" stop-color="#8DF7FF"/>
    </linearGradient>

    <linearGradient id="accentSpectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#FF2A85"/>
    </linearGradient>

    <radialGradient id="iconBg" cx="50%" cy="32%" r="76%">
      <stop offset="0%" stop-color="#1E2538"/>
      <stop offset="55%" stop-color="#0E121B"/>
      <stop offset="100%" stop-color="#07090E"/>
    </radialGradient>

    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#EDF1F7"/>
      <stop offset="100%" stop-color="#CED6E3"/>
    </linearGradient>

    <linearGradient id="trimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222633"/>
      <stop offset="100%" stop-color="#101219"/>
    </linearGradient>

    <linearGradient id="touchpadGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#272D3D"/>
      <stop offset="100%" stop-color="#0E1016"/>
    </linearGradient>

    <linearGradient id="ledSpectrum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#FF2A85"/>
    </linearGradient>

    <filter id="ledGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Lienzo panorámico -->
  <rect width="1200" height="360" rx="28" fill="url(#bannerBg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#ambientLeft)"/>
  <rect width="1200" height="360" rx="28" fill="url(#ambientCenter)"/>
  <rect width="1200" height="360" rx="28" fill="url(#ambientRight)"/>
  <rect x="1.5" y="1.5" width="1197" height="357" rx="26.5" fill="none" stroke="url(#bannerRim)" stroke-width="1.5"/>

  <!-- Rejilla tecnológica sutil -->
  <g stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="340" y1="0" x2="340" y2="360"/>
  </g>

  <!-- Icono DualSense Squircle izquierdo -->
  <g transform="translate(72, 66) scale(0.445)" filter="url(#softShadow)">
    <rect width="512" height="512" rx="114" fill="url(#iconBg)" stroke="url(#bannerRim)" stroke-width="3"/>
    <path d="M 118 148 Q 138 134 166 138 L 166 146 L 118 148 Z" fill="#1C202B"/>
    <path d="M 394 148 Q 374 134 346 138 L 346 146 L 394 148 Z" fill="#1C202B"/>
    <path d="M 256 144 L 354 144 C 386 144 408 160 420 194 C 436 240 446 300 436 338 C 428 366 396 372 378 350 C 358 326 346 294 324 284 C 302 276 280 278 256 278 C 232 278 210 276 188 284 C 166 294 154 326 134 350 C 116 372 84 366 76 338 C 66 300 76 240 92 194 C 104 160 126 144 158 144 Z" fill="url(#shellGrad)"/>
    <path d="M 148 238 C 158 216 178 214 202 214 L 310 214 C 334 214 354 216 364 238 C 376 266 378 320 368 365 L 144 365 C 134 320 136 266 148 238 Z" fill="url(#trimGrad)"/>
    <path d="M 176 144 L 336 144 L 323 204 C 321 210 315 214 309 214 L 203 214 C 197 214 191 210 189 204 Z" fill="url(#touchpadGrad)"/>
    <g filter="url(#ledGlow)" fill="none" stroke-linecap="round">
      <path d="M 174 149 L 187 204 Q 190 213 200 215" stroke="url(#ledSpectrum)" stroke-width="10"/>
      <path d="M 174 149 L 187 204 Q 190 213 200 215" stroke="#FFFFFF" stroke-width="2.4" stroke-opacity="0.9"/>
      <path d="M 338 149 L 325 204 Q 322 213 312 215" stroke="url(#ledSpectrum)" stroke-width="10"/>
      <path d="M 338 149 L 325 204 Q 322 213 312 215" stroke="#FFFFFF" stroke-width="2.4" stroke-opacity="0.9"/>
      <line x1="244" y1="223" x2="268" y2="223" stroke="url(#ledSpectrum)" stroke-width="4"/>
    </g>
    <circle cx="202" cy="248" r="20" fill="#0B0D12"/>
    <circle cx="202" cy="248" r="15" fill="#232836" stroke="#495268" stroke-width="1.5"/>
    <circle cx="310" cy="248" r="20" fill="#0B0D12"/>
    <circle cx="310" cy="248" r="15" fill="#232836" stroke="#495268" stroke-width="1.5"/>
  </g>

  <!-- Bloque de identidad y eslogan -->
  <g transform="translate(368, 96)">
    <rect x="0" y="0" width="198" height="28" rx="14" fill="#00F0FF" fill-opacity="0.10" stroke="#00F0FF" stroke-opacity="0.34"/>
    <text x="16" y="18.5" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1.4" fill="#7BF5FF">TAURI v2 · RUST HID</text>

    <text x="0" y="84" font-family="Plus Jakarta Sans, Inter, Segoe UI, system-ui, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.2" fill="url(#titleGrad)">DualSenseColour</text>
    <rect x="462" y="42" width="68" height="36" rx="10" fill="url(#accentSpectrum)" fill-opacity="0.18" stroke="url(#accentSpectrum)" stroke-opacity="0.6"/>
    <text x="496" y="66" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="700" fill="#FFFFFF">PC</text>

    <rect x="0" y="102" width="144" height="3.5" rx="2" fill="url(#accentSpectrum)"/>

    <text x="0" y="138" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="400" fill="#B5C0D4">
      Customize your PS5 DualSense RGB lightbar on PC with zero bloatware.
    </text>

    <!-- Chips de capacidades -->
    <g transform="translate(0, 168)" font-family="JetBrains Mono, Consolas, monospace" font-size="12.5" font-weight="600">
      <rect x="0" y="0" width="168" height="32" rx="10" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.35"/>
      <circle cx="18" cy="16" r="4" fill="#10B981"/>
      <text x="32" y="20.5" fill="#A7F3D0">USB Report 0x02</text>

      <rect x="182" y="0" width="210" height="32" rx="10" fill="#00F0FF" fill-opacity="0.10" stroke="#00F0FF" stroke-opacity="0.32"/>
      <circle cx="200" cy="16" r="4" fill="#00F0FF"/>
      <text x="214" y="20.5" fill="#A5F3FC">BT 0x31 + CRC-32 0xA2</text>

      <rect x="406" y="0" width="224" height="32" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <circle cx="424" cy="16" r="4" fill="#FF2A85"/>
      <text x="438" y="20.5" fill="#E2E8F0">Win · Ubuntu · SteamOS</text>
    </g>
  </g>
</svg>
